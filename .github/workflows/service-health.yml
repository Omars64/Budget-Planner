name: Budgetly service health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: budgetly-service-health
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'Omars64/Budget-Planner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check readiness and maintain incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/monitor-production.py --url https://budget-planner-ecru-seven.vercel.app/api/health/ready --github-issues
