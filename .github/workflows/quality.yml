name: Budgetly quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: budgetly_verification_source
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d budgetly_verification_source"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install matching PostgreSQL client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Prepare empty synthetic target
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" createdb -U postgres budgetly_verification_target
      - name: Rehearse encrypted database recovery
        run: python -m scripts.rehearse_database_recovery --source 'postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:55433/budgetly_verification_source' --target 'postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:55433/budgetly_verification_target' --pg-bin /usr/lib/postgresql/17/bin --output recovery-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-recovery-evidence
          path: recovery-evidence.json
          if-no-files-found: error
  browser-reliability:
    uses: ./.github/workflows/browser-reliability.yml
  postgres-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: budgetly_verification_load
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d budgetly_verification_load"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify concurrent reads, writes and replay without production access
        run: python -m scripts.verify_load --url 'postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:55432/budgetly_verification_load' --workers 32 --duration 30 --diagnose-errors --output postgres-load-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-load-evidence
          path: postgres-load-evidence.json
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: budgetly_verification_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d budgetly_verification_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.verify_postgres --url 'postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/budgetly_verification_ci' --workers 8 --output postgres-evidence.json
      - name: Verify permissions and recovery interleavings
        run: python tests/test_financial_coordination.py --url 'postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/budgetly_verification_ci'
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-concurrency-evidence
          path: postgres-evidence.json
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOWBUDGET_DATABASE_URL: sqlite:////tmp/budgetly-ci.db
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run release:check
      - run: node scripts/verify-service-worker.mjs
      - run: python -m pytest tests -q
  android-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: bash android/gradlew -p android :app:testDebugUnitTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-jvm-results
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
