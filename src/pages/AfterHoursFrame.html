<!doctype html><html lang="en" data-account="ACCOUNT_ID"><base href="STUDIO_BASE"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Hours · Budgetly Miami</title><style>
*{box-sizing:border-box}body{margin:0;background:#120e19;color:#fff4ea;font:17px system-ui,sans-serif}main{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}.art,.shade{position:absolute;inset:0;z-index:-2}.art{background-size:cover;background-position:65% 50%;opacity:0;transform:scale(1.05);transition:opacity .8s,transform 5s ease-out}.art.live{opacity:1;transform:scale(1)}.shade{z-index:-1;background:linear-gradient(0deg,#170e1e 0%,transparent 55%),linear-gradient(90deg,#190f20c9,transparent 66%),linear-gradient(#180e2099,transparent 19%)}header,footer,.hero{padding:clamp(18px,4vw,64px)}header,footer,.buttons{display:flex;align-items:center;gap:10px}header{justify-content:space-between;padding-top:20px;padding-bottom:15px}header strong{font-size:23px;letter-spacing:-1.5px}button{font:inherit;cursor:pointer;color:inherit;background:#1c1524e6;border:1px solid #ffffff77;border-radius:100px;padding:10px 16px}button:hover,button:focus-visible,select:focus-visible{outline:2px solid #ffbb8b;outline-offset:2px}.primary{color:#301323;background:#ffc398;border:none;font-weight:750;padding:14px 24px}.hero{margin-top:auto;padding-bottom:16px;padding-top:18vh}.meta{font:700 13px Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#ffcfac}h1{font:900 clamp(66px,10.8vw,160px)/.87 Impact,'Arial Black',sans-serif;text-transform:uppercase;letter-spacing:-.045em;margin:15px 0;text-shadow:0 3px 28px #170b2333}.hero p{max-width:420px;text-shadow:0 1px 6px #100916;font-weight:550}.hero em{color:#ffab92;font-family:Georgia,serif;text-transform:none}.channels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px clamp(18px,4vw,64px) 0}.channel{border-radius:8px;text-align:left;background:linear-gradient(90deg,#181020fa,#251526a6),var(--img) center/cover;padding:12px 17px}.channel b,.channel small{display:block}.channel[aria-pressed=true]{border-color:#ffc398;box-shadow:inset 3px 0 #ffc398}.channel small,footer{font:12px Consolas,monospace}footer{padding-block:16px;justify-content:space-between}dialog{color:#fff4ea;background:#261d2b;border:1px solid #806877;border-radius:20px;padding:24px;width:min(430px,93vw)}dialog::backdrop{background:#0f0a15ac;backdrop-filter:blur(6px)}h2{margin:8px 0;font-size:30px}select{display:block;width:100%;background:#332a37;color:white;padding:12px;border-radius:8px;margin:8px 0 20px}label{display:block;margin:16px 0}p{line-height:1.5}.plain{padding:32px;max-width:780px}.plain section{padding:25px;background:#283246;border-radius:16px}body.off{background:#111b2b}body.off main{display:none}[hidden]{display:none!important}@media(max-width:600px){header strong{font-size:21px}header button{padding:9px;font-size:14px}.hero{padding-top:30vh}.channels{gap:5px}.channel{font-size:14px;padding:11px 8px}.channel small{font-size:10px}.shade{background:linear-gradient(0deg,#170e1e 3%,#170e1eb0 42%,transparent 70%),linear-gradient(#180e20ab,transparent 20%)}h1{font-size:clamp(53px,14vw,90px)}}@media(prefers-reduced-motion:reduce){.art{transition:none;transform:none}}
.shell{min-height:100svh;background:#111c30;color:#edf3ff;padding:clamp(20px,6vw,78px)}.wrap{max-width:800px;margin:auto}.shell h1{font:750 clamp(36px,7vw,68px)/1.2 system-ui;text-transform:none;letter-spacing:-.05em}.shell section{background:#222f45;border-radius:22px;padding:20px;margin:24px 0}.row{display:block;width:100%;text-align:left;border-radius:10px;background:#303e53;margin:8px 0;padding:16px}.shell small{color:#b1c1d7}.shell label{padding:15px;background:#344359;border-radius:14px}dialog{max-height:90svh;overflow:auto}dialog input[type=text]{width:100%;padding:10px;background:#352738;color:white;border:1px solid #866b80;border-radius:8px;font:inherit}.field{display:flex;justify-content:space-between;align-items:center}.field button{font-size:12px;padding:5px 9px}#customize details{border-top:1px solid #745a70;padding:12px 0}summary{cursor:pointer;font-weight:bold}#customize select{margin-bottom:10px}#previewCard{background-size:cover;background-position:center;border-radius:14px;padding:22px;text-shadow:0 1px 6px #000}#previewCard p{margin:5px 0}.still .art{transition:none;transform:none}#welcome{font-weight:bold;margin-bottom:0}#desc{margin-top:4px}#status{font-size:14px;color:#ffcca4}input[type=file]{max-width:100%;font:inherit}#customize .buttons{flex-wrap:wrap}#audioLabel{font-size:13px}
</style>
